  // ---------- Comparar con otro archivo ----------
  function renderCompareEntry() {
    if (state.compareLoading) {
      return el("span", { class: "compare-loading" }, ["Comparando…"]);
    }
    if (state.compare) {
      return el("button", { class: "btn btn-ghost", onclick: () => { state.compare = null; render(); } }, ["✕ Salir de la comparación"]);
    }
    return el("button", { class: "btn btn-ghost", onclick: onCompareClick }, ["⇄ Comparar con otro archivo"]);
  }

  function onCompareClick() {
    const input = document.createElement("input");
    input.type = "file";
    input.accept = ".mbz,.zip";
    input.style.display = "none";
    input.addEventListener("change", () => {
      if (input.files[0]) handleCompareFile(input.files[0]);
      input.remove();
    });
    document.body.appendChild(input);
    input.click();
  }

  async function handleCompareFile(file) {
    const mySession = state.parsed; // si cambias de curso principal a medio comparar, descartamos en silencio
    state.compareLoading = true;
    render();
    try {
      const buf = await file.arrayBuffer();
      if (state.parsed !== mySession) return;
      const bytes = new Uint8Array(buf);
      const fileMap = await unpackInWorker(bytes);
      if (state.parsed !== mySession) return;
      const result = MBZParser.interpretFileMap(fileMap);
      precomputeDisplayText(result.course);
      if (state.parsed !== mySession) return;
      const diff = MBZCompare.compareCourses(state.parsed.course, result.course);
      state.compare = { course: result.course, diff };
      state.compareLoading = false;
      render();
    } catch (e) {
      state.compareLoading = false;
      if (state.parsed !== mySession) return;
      console.error(e);
      alert("No se ha podido comparar el archivo: " + e.message);
      render();
    }
  }

  function diffLabel(status) {
    return { added: "Añadida", removed: "Eliminada", modified: "Modificada", added_section: "Sección nueva", removed_section: "Sección eliminada" }[status] || "";
  }

  function renderCompareView() {
    const { diff, course: courseB } = state.compare;
    const wrap = el("div", { class: "compare-wrap" });
    wrap.appendChild(el("p", { class: "compare-subtitle" }, ["Comparando con: ", el("strong", {}, [courseB.name])]));
    wrap.appendChild(el("ul", { class: "manifest-stats" }, [
      el("li", { class: "tabular diff-badge diff-added" }, [`+${diff.summary.added} añadida(s)`]),
      el("li", { class: "tabular diff-badge diff-removed" }, [`−${diff.summary.removed} eliminada(s)`]),
      el("li", { class: "tabular diff-badge diff-modified" }, [`~${diff.summary.modified} modificada(s)`]),
      el("li", { class: "tabular" }, [`${diff.summary.unchanged} sin cambios`]),
    ]));

    for (const sec of diff.sections) {
      const box = el("div", { class: "section" });
      const headChildren = [el("h3", { class: "section-title" }, [sec.title])];
      if (sec.sectionStatus !== "unchanged") {
        headChildren.push(el("span", { class: "diff-badge diff-" + sec.sectionStatus }, [diffLabel(sec.sectionStatus + "_section")]));
      }
      box.appendChild(el("div", { class: "section-header" }, headChildren));

      const list = el("div", { class: "activity-list" });
      for (const row of sec.rows) {
        const act = row.act;
        const rowChildren = [
          el("span", { "aria-hidden": "true" }, [act.icon]),
          el("span", { class: "activity-title" }, [act.title]),
          el("span", { class: "stamp" }, [act.typeLabel]),
        ];
        if (row.status !== "unchanged") rowChildren.push(el("span", { class: "diff-badge diff-" + row.status }, [diffLabel(row.status)]));
        list.appendChild(el("div", { class: "activity diff-row" + (row.status === "unchanged" ? " diff-row-unchanged" : "") }, [
          el("div", { class: "activity-head" }, rowChildren),
        ]));
      }
      box.appendChild(list);
      wrap.appendChild(box);
    }
    return wrap;
  }

  // Categorías del filtro de tipo de contenido, con su etiqueta para el
  // panel de exportación. El texto convertido de páginas/etiquetas cuenta
  // como "pdf" o "doc" según el formato elegido arriba (ver categorizeFileType
  // y textFilterCategory en MBZExporter.buildExportZip).
  const TYPE_FILTER_OPTIONS = [
    { key: "pdf", label: "📄 PDF", title: "Texto convertido a PDF (si el formato de arriba es PDF) + archivos .pdf adjuntos + PDF único del curso" },
    { key: "doc", label: "📑 Documentos", title: "Texto convertido a TXT (si el formato de arriba es TXT) + adjuntos tipo doc, xls, ppt, odt, csv, rtf, txt" },
    { key: "image", label: "🖼️ Imágenes", title: "Adjuntos tipo jpg, png, gif, webp, svg…" },
    { key: "other", label: "📦 Otros archivos", title: "El resto de adjuntos (zip, audio, vídeo, SCORM…)" },
    { key: "links", label: "🔗 Enlaces", title: "Accesos directos .url de las actividades tipo URL" },
  ];

  function renderTypeFilter() {
    const tf = state.exportOpts.typeFilter;
    return el("div", { class: "field-group", role: "group", "aria-label": "Filtrar por tipo de contenido" }, [
      el("span", { class: "field-label" }, ["Incluir en la descarga:"]),
      ...TYPE_FILTER_OPTIONS.map(opt => el("label", { class: "checkbox", title: opt.title }, [
        el("input", {
          type: "checkbox", checked: tf[opt.key] ? "checked" : null,
          onchange: (e) => { tf[opt.key] = e.target.checked; },
        }),
        ` ${opt.label}`,
      ])),
      el("span", { class: "select-actions" }, [
        el("button", { class: "btn-link", onclick: () => { TYPE_FILTER_OPTIONS.forEach(o => tf[o.key] = true); render(); } }, ["Todos"]),
        el("button", { class: "btn-link", onclick: () => { TYPE_FILTER_OPTIONS.forEach(o => tf[o.key] = false); render(); } }, ["Ninguno"]),
      ]),
    ]);
  }

  function renderExportBar() {
    const selCount = countSelected();
    const totalCount = totalActivities();

    const left = el("div", { class: "export-left" }, [
      el("div", { class: "field-group", role: "radiogroup", "aria-label": "Formato del texto exportado" }, [
        el("span", { class: "field-label" }, ["Texto de páginas/etiquetas:"]),
        el("label", { class: "radio" }, [
          el("input", { type: "radio", name: "textFormat", checked: state.exportOpts.textFormat === "pdf" ? "checked" : null, onchange: () => { state.exportOpts.textFormat = "pdf"; } }),
          " PDF",
        ]),
        el("label", { class: "radio" }, [
          el("input", { type: "radio", name: "textFormat", checked: state.exportOpts.textFormat === "txt" ? "checked" : null, onchange: () => { state.exportOpts.textFormat = "txt"; } }),
          " TXT",
        ]),
      ]),
      el("label", { class: "checkbox" }, [
        el("input", { type: "checkbox", checked: state.exportOpts.singleCoursePdf ? "checked" : null, onchange: (e) => { state.exportOpts.singleCoursePdf = e.target.checked; } }),
        " Generar también un PDF único de todo el curso",
      ]),
      renderTypeFilter(),
      el("div", { class: "select-actions" }, [
        el("button", { class: "btn-link", onclick: () => { state.selection = { sections: {}, activities: {} }; render(); } }, ["Seleccionar todo"]),
        el("button", {
          class: "btn-link", onclick: () => {
            const sel = { sections: {}, activities: {} };
            for (const sec of state.parsed.course.sections) { sel.sections[sec.sectionid] = false; for (const a of sec.activities) sel.activities[a.moduleid] = false; }
            state.selection = sel; render();
          }
        }, ["Deseleccionar todo"]),
      ]),

    const right = el("div", { class: "export-right" }, [
      el("button", { class: "btn btn-primary btn-export", disabled: selCount === 0 ? "disabled" : null, onclick: onExportClick },
        [`⬇ Descargar selección (`, el("span", { class: "tabular" }, [`${selCount}/${totalCount}`]), `) .zip`]),

  function renderSection(sec, index) {
    const included = isSectionIncluded(sec);
    const anyIncluded = sec.activities.some(a => isActivityIncluded(a));
    const box = el("div", { class: "section" + (included ? "" : anyIncluded ? " section-partial" : " section-excluded") });

    box.appendChild(el("div", { class: "section-header" }, [
      el("label", { class: "checkbox-row" }, [
        el("input", {
          type: "checkbox", checked: included ? "checked" : null,
          onchange: (e) => setSectionIncluded(sec, e.target.checked, box),
        }),
        el("span", { class: "section-index", "aria-hidden": "true" }, [ordinal(index)]),
        el("h3", { class: "section-title" }, [sec.title]),
      ]),
      el("span", { class: "section-count tabular" }, [`${sec.activities.length}`]),
    ]));
    if (sec._summaryText) {
      box.appendChild(el("p", { class: "section-summary" }, [truncate(sec._summaryText, 220)]));
    }

    const list = el("div", { class: "activity-list" });
    sec.activities.forEach(act => list.appendChild(renderActivity(sec, act, box)));
    box.appendChild(list);
    return box;
  }

  // Convierte HTML a texto una única vez por actividad/sección justo tras el
  // parseo, en vez de en cada render: con cursos grandes (cientos de
  // actividades), recalcularlo en cada clic de checkbox era el 60%+ del coste
  // de repintar — ver test/run_stress_profile.js.
  function precomputeDisplayText(course) {
    for (const sec of course.sections) {
      sec._summaryText = sec.summary ? MBZHtml.htmlToText(sec.summary) : "";
      for (const act of sec.activities) act._previewText = computePreviewText(act);
    }
  }

  function computePreviewText(act) {
    if (act.modulename === "url" && act.externalUrl) return act.externalUrl;
    if (act.modulename === "quiz") {
      const n = act.quiz && act.quiz.questions ? act.quiz.questions.length : 0;
      return n ? `${n} pregunta(s): ` + act.quiz.questions.map(q => q.name).join(" · ") : "Cuestionario sin preguntas extraíbles";
    }
    if (act.modulename === "forum") {
      const n = act.discussions ? act.discussions.length : 0;
      return n ? `${n} debate(s): ` + act.discussions.map(d => d.name).join(" · ") : "Sin mensajes extraíbles en este foro";
    }
    if (act.modulename === "glossary") {
      const n = act.entries ? act.entries.length : 0;
      return n ? `${n} entrada(s): ` + act.entries.slice(0, 6).map(e => e.concept).join(" · ") : "Sin entradas extraíbles en este glosario";
    }
    if (act.modulename === "choice") {
      return act.options && act.options.length ? "Opciones: " + act.options.join(" · ") : "Sin opciones extraíbles";
    }
    if (act.modulename === "wiki") {
      const n = act.wikiPages ? act.wikiPages.length : 0;
      return n ? `${n} página(s): ` + act.wikiPages.slice(0, 6).map(p => p.title).join(" · ") : "Sin páginas extraíbles en este wiki";
    }
    if (act.modulename === "lesson") {
      const n = act.lessonPages ? act.lessonPages.length : 0;
      return n ? `${n} página(s): ` + act.lessonPages.slice(0, 6).map(p => p.title).join(" · ") : "Sin páginas extraíbles en esta lección";
    }
    if (act.modulename === "workshop") {
      const n = act.workshop && act.workshop.examples ? act.workshop.examples.length : 0;
      return n ? `${n} entrega(s) de ejemplo` : "Instrucciones del taller (ver contenido)";
    }
    if (act.modulename === "data") {
      const n = act.dataFields ? act.dataFields.length : 0;
      return n ? `${n} campo(s): ` + act.dataFields.slice(0, 6).map(f => f.name).join(" · ") : "Sin campos extraíbles";
    }
    if (act.modulename === "chat") {
      const n = act.chatMessages ? act.chatMessages.length : 0;
      return n ? `${n} mensaje(s) de chat` : "Sin mensajes extraíbles en este chat";
    }
    if (act.content) return MBZHtml.htmlToText(act.content);
    if (act.intro) return MBZHtml.htmlToText(act.intro);
    if (act.chapters && act.chapters.length) return act.chapters.map(c => c.title).join(" · ");
    return "";
  }
  function activityPreviewText(act) { return act._previewText || ""; }
  function activityFullText(act) {
    const parts = [];
    const intro = MBZHtml.htmlToText(act.intro);
    if (intro) parts.push(intro);
    if (act.modulename === "url" && act.externalUrl) parts.push("Enlace: " + act.externalUrl);
    else if (act.modulename === "quiz") parts.push(MBZHtml.quizToPlainText(act.quiz));
    else if (act.modulename === "forum") parts.push(MBZHtml.forumToPlainText(act.discussions));
    else if (act.modulename === "glossary") parts.push(MBZHtml.glossaryToPlainText(act.entries));
    else if (act.modulename === "choice") parts.push("Opciones:\n" + MBZHtml.choiceToPlainText(act.options));
    else if (act.modulename === "wiki") parts.push(MBZHtml.wikiToPlainText(act.wikiPages));
    else if (act.modulename === "lesson") parts.push(MBZHtml.lessonToPlainText(act.lessonPages));
    else if (act.modulename === "workshop") parts.push(MBZHtml.workshopToPlainText(act.workshop));
    else if (act.modulename === "data") parts.push(MBZHtml.dataFieldsToPlainText(act.dataFields));
    else if (act.modulename === "chat") parts.push(MBZHtml.chatToPlainText(act.chatMessages));
    else if (act.chapters && act.chapters.length) {
      for (const ch of act.chapters) { parts.push("· " + (ch.title || "Capítulo")); const t = MBZHtml.htmlToText(ch.contentRaw); if (t) parts.push(t); }
    } else if (act.content) { const t = MBZHtml.htmlToText(act.content); if (t) parts.push(t); }
    return parts.join("\n\n");
  }

  function renderActivity(sec, act, sectionEl) {
    const included = isActivityIncluded(act);
    const row = el("div", { class: "activity" + (included ? "" : " activity-excluded") });
    const previewId = `preview-${act.moduleid}`;

    row.appendChild(el("div", { class: "activity-head" }, [
      el("label", { class: "checkbox-row", style: "flex:1 1 auto; min-width:0;" }, [
        el("input", {
          type: "checkbox", checked: included ? "checked" : null,
          onchange: (e) => setActivityIncluded(sec, act, e.target.checked, row, sectionEl),
        }),
        el("span", { "aria-hidden": "true" }, [act.icon]),
        el("span", { class: "activity-title" }, [act.title]),
        el("span", { class: "stamp" }, [act.typeLabel]),
      ]),
      el("button", {
        class: "btn-link btn-preview", "aria-expanded": "false", "aria-controls": previewId,
        onclick: (e) => togglePreview(e.currentTarget, act, previewId),
      }, ["Ver contenido"]),
    ]));

    const preview = truncate(activityPreviewText(act), 140);
    if (preview) row.appendChild(el("p", { class: "activity-preview" }, [preview]));

    const mediaPreviewId = `mediaprev-${act.moduleid}`;
    if (act.files && act.files.length) {
      row.appendChild(el("div", { class: "file-chips" }, act.files.map(f => {
        if (f.existsInArchive && isPreviewableFile(f)) {
          return el("button", {
            type: "button", class: "chip chip-preview",
            onclick: (e) => toggleMediaPreview(e.currentTarget, f, mediaPreviewId),
          }, [`👁 ${f.filename} (${fmtBytes(f.filesize)})`]);
        }
        return el("span", { class: "chip" + (f.existsInArchive ? "" : " chip-missing") }, [`📎 ${f.filename} (${fmtBytes(f.filesize)})`]);
      })));
      row.appendChild(el("div", { class: "full-text-wrap", id: mediaPreviewId }, [
        el("div", { class: "full-text-inner media-preview-inner" }),
      ]));
    }
    if (!act.supported) {
      row.appendChild(el("p", { class: "activity-unsupported" }, ["Vista simplificada: no se ha podido leer el contenido completo de este tipo de actividad."]));
    }

    row.appendChild(el("div", { class: "full-text-wrap", id: previewId }, [
      el("div", { class: "full-text-inner" }),
    ]));
    return row;
  }

  function togglePreview(btn, act, previewId) {
    const wrap = document.getElementById(previewId);
    const inner = wrap.querySelector(".full-text-inner");
    const isOpen = wrap.classList.contains("open");
    if (isOpen) {
      wrap.classList.remove("open");
      btn.setAttribute("aria-expanded", "false");
      btn.textContent = "Ver contenido";
      return;
    }
    if (!inner.dataset.filled) {
      const text = activityFullText(act);
      inner.appendChild(el("pre", { class: "full-text" }, [text || "(Sin contenido de texto para esta actividad.)"]));
      inner.dataset.filled = "1";
    }
    wrap.classList.add("open");
    btn.setAttribute("aria-expanded", "true");
    btn.textContent = "Ocultar";
  }

  // ---------- Vista previa de imágenes/PDF sin descargar ----------
  function isPreviewableFile(f) {
    const m = (f.mimetype || "").toLowerCase();
    return m.startsWith("image/") || m === "application/pdf";
  }
  const mediaPreviewUrls = new Map(); // previewId -> blob URL actualmente mostrada ahí (para poder revocarla)

  function toggleMediaPreview(btn, f, previewId) {
    const wrap = document.getElementById(previewId);
    const inner = wrap.querySelector(".media-preview-inner");
    const isOpenSameFile = wrap.classList.contains("open") && inner.dataset.currentFile === f.physicalPath;

    // Si ya había algo abierto en este hueco (mismo archivo u otro de la misma
    // actividad), liberamos su blob antes de seguir — nunca dejamos URLs sueltas.
    const prevUrl = mediaPreviewUrls.get(previewId);
    if (prevUrl) { URL.revokeObjectURL(prevUrl); mediaPreviewUrls.delete(previewId); }
    const prevBtn = wrap.parentElement.querySelector(".chip-preview.active");
    if (prevBtn) prevBtn.classList.remove("active");

    if (isOpenSameFile) {
      wrap.classList.remove("open");
      inner.innerHTML = "";
      delete inner.dataset.currentFile;
      return;
    }

    const data = state.parsed.fileMap.get(f.physicalPath);
    if (!data) return;
    const blob = new Blob([data], { type: f.mimetype || "application/octet-stream" });
    const url = URL.createObjectURL(blob);
    mediaPreviewUrls.set(previewId, url);

    inner.innerHTML = "";
    const isPdf = (f.mimetype || "").toLowerCase() === "application/pdf";
    if (isPdf) {
      inner.appendChild(el("iframe", { class: "media-preview-frame", src: url, title: f.filename }));
    } else {
      inner.appendChild(el("img", { class: "media-preview-img", src: url, alt: f.filename }));
    }
    inner.dataset.currentFile = f.physicalPath;
    wrap.classList.add("open");
    btn.classList.add("active");
  }

  function renderUnlisted(unlistedFiles) {
    return el("details", { class: "unlisted" }, [
      el("summary", {}, [`📎 ${unlistedFiles.length} archivo(s) del curso no asociados a ninguna actividad visible`]),
      el("label", { class: "checkbox" }, [
        el("input", { type: "checkbox", checked: state.includeUnlisted ? "checked" : null, onchange: (e) => { state.includeUnlisted = e.target.checked; } }),
        " Incluirlos igualmente en la descarga (carpeta “Otros archivos del curso”)",
      ]),
      el("ul", { class: "unlisted-list" }, unlistedFiles.map(f => el("li", {}, [`${f.filename} — ${fmtBytes(f.filesize)} (${f.component || "?"})`]))),
    ]);
  }

  // ---------- Exportación ----------
  async function onExportClick() {
    const btn = $(".btn-export");
    const originalHtml = btn.innerHTML;
    const mySession = state.parsed; // si cambias de curso a media exportación, la descarga vieja no debe dispararse
    btn.disabled = true;
    btn.textContent = "Generando…";
    try {
      await new Promise(r => setTimeout(r, 0));
      const extraUnlisted = state.includeUnlisted ? state.parsed.unlistedFiles : [];
      const zipBytes = await MBZExporter.buildExportZip(
        state.parsed.course,
        state.parsed.fileMap,
        state.selection,
        state.exportOpts,
        (info) => { if (info.n && info.total) btn.textContent = `Generando… (${info.n}/${info.total})`; },
        extraUnlisted
      );
      if (state.parsed !== mySession) return; // curso ya no vigente: descartamos en silencio
      const blob = new Blob([zipBytes], { type: "application/zip" });
      const url = URL.createObjectURL(blob);
      const a = document.createElement("a");
      const safeName = (mySession.course.name || "curso").replace(/[\\/:*?"<>|]/g, "-").trim() || "curso";
      a.href = url;
      a.download = `${safeName}.zip`;
      document.body.appendChild(a);
      a.click();
      a.remove();
      setTimeout(() => URL.revokeObjectURL(url), 4000);

      // Confirmación breve — hasta ahora la única señal de que terminó bien
      // era el propio gestor de descargas del navegador; el botón volvía a
      // su estado normal en silencio, sin cerrar el círculo de la acción.
      btn.classList.add("btn-success");
      btn.disabled = false;
      btn.textContent = "✓ Descargado";
      setTimeout(() => {
        if (state.parsed !== mySession) return;
        btn.classList.remove("btn-success");
        btn.innerHTML = originalHtml;
      }, 1600);
      return;
    } catch (e) {
      if (state.parsed !== mySession) return;
      console.error(e);
      alert("No se ha podido generar la descarga: " + e.message);
    }
    if (state.parsed === mySession) {
      btn.disabled = false;
      btn.innerHTML = originalHtml;
    }
  }

  // ---------- Tema claro/oscuro ----------
  function initTheme() {
    const saved = localStorage.getItem("moodleextractor_theme");
    if (saved === "dark") document.documentElement.classList.add("dark");
    updateThemeColorMeta();
    const btn = document.getElementById("theme-toggle");
    if (btn) btn.addEventListener("click", () => {
      document.documentElement.classList.toggle("dark");
      const isLight = !document.documentElement.classList.contains("dark");
      localStorage.setItem("moodleextractor_theme", isLight ? "light" : "dark");
      updateThemeColorMeta();
    });
  }
  function updateThemeColorMeta() {
    const meta = document.querySelector('meta[name="theme-color"]');
    if (!meta) return;
    const isLight = !document.documentElement.classList.contains("dark");
    meta.setAttribute("content", isLight ? "#f7f6f3" : "#1b1917");
  }

  initTheme();
  render();
})();

  </script>
</body>
</html>
